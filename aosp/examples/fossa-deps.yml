# --- hand-maintained sections (fossa-deps.base.yml) ---
# fossa-deps.base.yml — the hand-maintained part of fossa-deps.yml (judgment calls the tree cannot prove).
# tools/gen-fossa-deps.py appends this verbatim after the generated referenced-dependencies.
#
vendored-dependencies:
  # upstream is git.sv.nongnu.org (not github) -> license via archive scan here, CVEs would come via its CPE in the SBOM lane (returned nothing on 2026-11-04)
  - name: aosp-external-freetype
    path: external/freetype
    version: "2.13.2"
    metadata:
      description: "FreeType 2.13.2 as vendored in vendor/acme/external/freetype (AOSP METADATA pin)"
      homepage: "https://freetype.org"
  # sqlite is not a git upstream (fossil); public-domain amalgamation -> archive license scan
  - name: aosp-external-sqlite
    path: external/sqlite
    version: "3.42.0"
    metadata:
      description: "SQLite 3.42.0 amalgamation as vendored in vendor/acme/external/sqlite"
      homepage: "https://sqlite.org"
  # the prebuilt jar directory itself: FOSSA unarchives each jar and license-scans what is inside
  - name: acme-prebuilts-libs
    path: prebuilts/acme/libs
    version: "android-15.0.0_r1-acme"

custom-dependencies:
  - name: acme-vehicle-platform-sdk
    version: "3.2.0"
    license: "proprietary-license"   # resolves in FOSSA (observed 2026-11-04); LicenseRef-* and "Proprietary" read back empty
    metadata:
      description: "ACME Vehicle Platform SDK (proprietary, prebuilts/acme/partner-sdk). Inventory only — no OSS inside."
      homepage: "https://acme-automotive.example"
