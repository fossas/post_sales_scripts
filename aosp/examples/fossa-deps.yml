# fossa-deps.yml — GENERATED by tools/gen-fossa-deps.py on every scan. Do not edit by hand.
#
# AOSP's build system (Soong / Android.bp + make) is not a package manager FOSSA can read, so the
# Soong side of the build is declared here. Each section is one lane:
#
#   referenced-dependencies / git    external/* projects, derived from their AOSP METADATA files
#                                    (tools/aosp_metadata_scan.py). FOSSA fetches the upstream at the
#                                    pinned tag/SHA server-side: license scan of the real upstream + CVEs by version.
#   referenced-dependencies / maven  prebuilt jars Soong consumes via java_import (prebuilts/**). Coordinates
#                                    are read from META-INF/maven/**/pom.properties inside each jar at generation
#                                    time; FOSSA resolves them against Maven Central: license + CVEs by version.
#   vendored-dependencies            directories archived + license-scanned by FOSSA (the official AOSP
#                                    walkthrough's lane). Hand-maintained in fossa-deps.base.yml.
#   custom-dependencies              proprietary code: inventory + declared license, no CVE data.
#                                    Hand-maintained in fossa-deps.base.yml.
#
referenced-dependencies:
  # --- prebuilts/** jars with pom.properties (Soong java_import), generated ---
  - type: maven
    name: com.google.code.gson:gson
    version: "2.8.5"
    metadata:
      description: "prebuilt prebuilts/acme/libs/gson-2.8.5.jar"
  - type: maven
    name: org:jaudiotagger
    version: "2.0.3"
    metadata:
      description: "prebuilt prebuilts/acme/libs/jaudiotagger-2.0.3.jar"
  - type: maven
    name: com.squareup.okhttp3:okhttp
    version: "3.12.0"
    metadata:
      description: "prebuilt prebuilts/acme/libs/okhttp-3.12.0.jar"
  - type: maven
    name: org.eclipse.paho:org.eclipse.paho.client.mqttv3
    version: "1.2.5"
    metadata:
      description: "prebuilt prebuilts/acme/libs/org.eclipse.paho.client.mqttv3-1.2.5.jar"
  # --- external/* from AOSP METADATA (tier 1: github upstream + resolvable pin), generated ---
  - type: git
    name: github.com/curl/curl
    version: "curl-8_12_1"
  - type: git
    name: github.com/libexpat/libexpat
    version: "R_2_5_0"
  - type: git
    name: github.com/glennrp/libpng
    version: "v1.6.44"
  - type: git
    name: github.com/madler/zlib
    version: "v1.2.13"
  - type: git
    name: github.com/facebook/zstd
    version: "v1.5.7"

# --- hand-maintained sections (fossa-deps.base.yml) ---
# fossa-deps.base.yml — the hand-maintained part of fossa-deps.yml.
#
# tools/gen-fossa-deps.py writes fossa-deps.yml on every scan: the referenced-dependencies (git entries
# from external/*/METADATA, maven entries from prebuilt jars' pom.properties) are generated, and this file
# is appended verbatim for the two sections that are judgment calls the tree cannot prove.
# Delete the examples below and declare your own; keep at least the two section headers.

vendored-dependencies:
  # A third-party directory whose upstream is not on github (or not a git repository at all): FOSSA
  # archives the directory, uploads it and license-scans every file. Name + version are cached
  # organization-wide (first scan wins); bump the version when the contents change.
  - name: external-freetype
    path: external/freetype
    version: "2.13.2"
    metadata:
      description: "FreeType as vendored in external/freetype (pin from its METADATA file)"
      homepage: "https://freetype.org"
  # The prebuilt jar directory itself: FOSSA unarchives each jar and license-scans what is inside,
  # which catches license texts the registry entry does not carry.
  - name: prebuilt-libs
    path: prebuilts/acme/libs
    version: "android-15.0.0_r1"

custom-dependencies:
  # Proprietary or partner code: inventory plus the declared license, no vulnerability data.
  # Use a license identifier FOSSA knows (an SPDX id, or `proprietary-license`), otherwise the row
  # shows as an unlicensed dependency until you conclude its license in the UI.
  - name: vehicle-platform-sdk
    version: "3.2.0"
    license: "proprietary-license"
    metadata:
      description: "Vehicle platform SDK (prebuilts/partner-sdk); no open-source code inside"
